<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JMK FR FOODHOUSE | Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ---------- Shared Design System ---------- */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #982121;
            --surface: #6F1717;
            --dark: #3d0808;
            --accent: #ffd166;
            --accent-hover: #FF611D;
            --light: #fff5f5;
            --muted: #ffcccc;
            --border: #813531;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--primary);
            color: var(--light);
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a { color: inherit; text-decoration: none; }

        header {
            background: var(--dark);
            padding: 20px 8%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border-bottom: 2px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            letter-spacing: 1px;
            color: var(--accent);
        }

        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        nav a {
            color: var(--light);
            font-size: 15px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 25px;
            transition: all 0.3s ease;
        }

        nav a:hover,
        nav a.active {
            background: var(--accent);
            color: var(--primary);
            transform: translateY(-2px);
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 44px;
            color: var(--accent);
            text-align: center;
            padding-top: 50px;
        }

        .page-title::after {
            content: "";
            display: block;
            width: 70px;
            height: 4px;
            background: var(--accent);
            margin: 15px auto 0;
            border-radius: 5px;
        }

        footer {
            background: var(--dark);
            border-top: 2px solid var(--accent);
            text-align: center;
            padding: 20px;
            margin-top: auto;
            font-size: 14px;
            color: var(--accent);
            letter-spacing: 1px;
        }

        /* ---------- Contact Card ---------- */
        .contact-wrap {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 50px 20px;
        }

        .contact-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        .contact-card h2 {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            color: var(--accent);
            margin-bottom: 30px;
        }

        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 35px;
        }

        .contact-btn {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 14px 20px;
            background: var(--dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--accent);
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .contact-btn i {
            font-size: 22px;
            width: 26px;
            text-align: center;
        }

        .contact-btn:hover {
            background: var(--accent);
            color: var(--primary);
            transform: translateY(-2px);
        }

        .phone-display {
            border-top: 1px solid var(--border);
            padding-top: 25px;
        }

        .phone-display h3 {
            font-size: 13px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .phone-number {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.5px;
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                padding: 18px 5%;
            }

            header h1 {
                font-size: 24px;
            }

            nav a {
                font-size: 14px;
                padding: 6px 10px;
            }

            .page-title {
                font-size: 34px;
            }

            .contact-card {
                padding: 28px 20px;
            }
        }
    </style>
    <link rel="stylesheet" href="assets/css/nav-auth.css">
</head>
<body>
    <header>
        <h1>JMK FR FOODHOUSE</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="product.html">Product</a>
            <a href="cart.html">Cart</a>
            <a href="contact.html" class="active">Contact</a>
            <a href="aboutus.html">About Us</a>
        </nav>
    </header>

    <h1 class="page-title">CONTACT US</h1>

    <main class="contact-wrap">
        <div class="contact-card">
            <h2>Our Contacts</h2>

            <div class="links-grid">
                <a href="https://www.facebook.com/" class="contact-btn" target="_blank" rel="noopener">
                    <i class="fab fa-facebook-f"></i> Facebook
                </a>
                <a href="mailto:Jmkfrfood@gmail.com" class="contact-btn">
                    <i class="far fa-envelope"></i> Gmail
                </a>
                <a href="https://www.tiktok.com" class="contact-btn" target="_blank" rel="noopener">
                    <i class="fab fa-tiktok"></i> TikTok
                </a>
                <a href="https://www.instagram.com/" class="contact-btn" target="_blank" rel="noopener">
                    <i class="fab fa-instagram"></i> Instagram
                </a>
            </div>

            <div class="phone-display">
                <h3>Contact Number</h3>
                <p class="phone-number">09923178965</p>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 JMK FR FOODHOUSE. All rights reserved.</p>
    </footer>
    <script src="assets/js/auth.js"></script>
</body>
</html>
