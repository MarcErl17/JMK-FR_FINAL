<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JMK FR FOODHOUSE | Cart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ---------- Shared Design System ---------- */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #982121;
            --surface: #6F1717;
            --dark: #3d0808;
            --accent: #ffd166;
            --accent-hover: #FF611D;
            --light: #fff5f5;
            --muted: #ffcccc;
            --border: #813531;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--primary);
            color: var(--light);
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a { color: inherit; text-decoration: none; }

        header {
            background: var(--dark);
            padding: 20px 8%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border-bottom: 2px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            letter-spacing: 1px;
            color: var(--accent);
        }

        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        nav a {
            color: var(--light);
            font-size: 15px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 25px;
            transition: all 0.3s ease;
        }

        nav a:hover,
        nav a.active {
            background: var(--accent);
            color: var(--primary);
            transform: translateY(-2px);
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 44px;
            color: var(--accent);
            text-align: center;
            padding-top: 50px;
        }

        .page-title::after {
            content: "";
            display: block;
            width: 70px;
            height: 4px;
            background: var(--accent);
            margin: 15px auto 0;
            border-radius: 5px;
        }

        footer {
            background: var(--dark);
            border-top: 2px solid var(--accent);
            text-align: center;
            padding: 20px;
            margin-top: auto;
            font-size: 14px;
            color: var(--accent);
            letter-spacing: 1px;
        }

        /* ---------- Cart ---------- */
        .cart-wrap {
            width: 100%;
            max-width: 900px;
            margin: 50px auto;
            padding: 0 5%;
        }

        .cart-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: white;
            color: var(--primary);
            padding: 15px 14px;
            text-align: left;
            font-size: 14px;
            font-weight: 700;
        }

        td {
            padding: 16px 14px;
            text-align: left;
            font-size: 15px;
            color: white;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

        tbody tr {
            transition: background 0.2s ease;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        tfoot td {
            font-weight: 700;
            color: var(--accent);
            border-bottom: none;
            font-size: 16px;
        }

        .cart-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 25px;
        }

        .btn {
            display: inline-block;
            background: var(--accent);
            color: var(--primary);
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: var(--accent-hover);
            color: white;
            transform: translateY(-2px);
        }

        /* ---------- Cart badge ---------- */
        .cart-badge {
            display: none;
            background: var(--accent);
            color: var(--primary);
            font-size: 12px;
            font-weight: 700;
            min-width: 20px;
            height: 20px;
            line-height: 20px;
            text-align: center;
            border-radius: 10px;
            margin-left: 6px;
            padding: 0 6px;
        }

        nav a:hover .cart-badge,
        nav a.active .cart-badge {
            background: var(--primary);
            color: var(--accent);
        }

        /* ---------- Cart items ---------- */
        .item-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .item-info img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid var(--border);
            flex-shrink: 0;
        }

        .item-name {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 600;
        }

        .qty-control {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .qty-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: var(--primary);
            font-size: 18px;
            font-weight: 700;
            line-height: 1;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .qty-btn:hover {
            background: var(--accent-hover);
            color: white;
        }

        .remove-btn {
            background: none;
            border: 1px solid var(--muted);
            color: var(--muted);
            border-radius: 20px;
            padding: 4px 12px;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .remove-btn:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
            color: white;
        }

        .empty-cart {
            text-align: center;
            padding: 40px 10px;
            color: var(--muted);
            font-size: 17px;
        }

        .cart-actions {
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                padding: 18px 5%;
            }

            header h1 {
                font-size: 24px;
            }

            nav a {
                font-size: 14px;
                padding: 6px 10px;
            }

            .page-title {
                font-size: 34px;
            }

            .cart-box {
                padding: 20px 14px;
            }

            th,
            td {
                padding: 12px 8px;
                font-size: 13px;
            }

            .item-info img {
                width: 56px;
                height: 56px;
            }

            .item-name {
                font-size: 15px;
            }
        }
    </style>
    <link rel="stylesheet" href="assets/css/nav-auth.css">
</head>
<body>
    <header>
        <h1>JMK FR FOODHOUSE</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="product.html">Product</a>
            <a href="cart.html" class="active">Cart</a>
            <a href="contact.html">Contact</a>
            <a href="aboutus.html">About Us</a>
        </nav>
    </header>

    <h1 class="page-title">SHOPPING CART</h1>

    <main class="cart-wrap">
        <div class="cart-box">
            <div id="empty-cart" class="empty-cart" style="display:none;">
                <p>Your cart is empty.</p>
            </div>

            <table id="cart-table">
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Subtotal</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="cart-body"></tbody>
                <tfoot>
                    <tr>
                        <td colspan="3">Total</td>
                        <td id="cart-total" colspan="2">₱0.00</td>
                    </tr>
                </tfoot>
            </table>

            <div class="cart-actions">
                <button class="btn btn-outline" id="clear-cart" type="button">Clear Cart</button>
                <a href="product.html" class="btn">Continue Shopping</a>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 JMK FR FOODHOUSE. All rights reserved.</p>
    </footer>
    <script src="cart.js"></script>
    <script>
        var body = document.getElementById('cart-body');
        var table = document.getElementById('cart-table');
        var emptyMsg = document.getElementById('empty-cart');
        var totalEl = document.getElementById('cart-total');
        var clearBtn = document.getElementById('clear-cart');

        function render() {
            var cart = Cart.get();
            body.innerHTML = '';

            var isEmpty = cart.length === 0;
            table.style.display = isEmpty ? 'none' : '';
            emptyMsg.style.display = isEmpty ? 'block' : 'none';
            clearBtn.style.display = isEmpty ? 'none' : '';

            var total = 0;

            cart.forEach(function (item) {
                var subtotal = item.price * item.qty;
                total += subtotal;

                var tr = document.createElement('tr');

                var tdProduct = document.createElement('td');
                var info = document.createElement('div');
                info.className = 'item-info';
                var img = document.createElement('img');
                img.src = item.image;
                img.alt = item.name;
                var name = document.createElement('span');
                name.className = 'item-name';
                name.textContent = item.name;
                info.appendChild(img);
                info.appendChild(name);
                tdProduct.appendChild(info);

                var tdPrice = document.createElement('td');
                tdPrice.textContent = Cart.formatPeso(item.price);

                var tdQty = document.createElement('td');
                var qty = document.createElement('div');
                qty.className = 'qty-control';
                var minus = document.createElement('button');
                minus.className = 'qty-btn';
                minus.type = 'button';
                minus.textContent = '−';
                minus.setAttribute('aria-label', 'Decrease quantity');
                minus.onclick = function () { Cart.changeQty(item.id, -1); render(); };
                var num = document.createElement('span');
                num.textContent = item.qty;
                var plus = document.createElement('button');
                plus.className = 'qty-btn';
                plus.type = 'button';
                plus.textContent = '+';
                plus.setAttribute('aria-label', 'Increase quantity');
                plus.onclick = function () { Cart.changeQty(item.id, 1); render(); };
                qty.appendChild(minus);
                qty.appendChild(num);
                qty.appendChild(plus);
                tdQty.appendChild(qty);

                var tdSub = document.createElement('td');
                tdSub.textContent = Cart.formatPeso(subtotal);

                var tdRemove = document.createElement('td');
                var rm = document.createElement('button');
                rm.className = 'remove-btn';
                rm.type = 'button';
                rm.textContent = 'Remove';
                rm.onclick = function () { Cart.remove(item.id); render(); };
                tdRemove.appendChild(rm);

                tr.appendChild(tdProduct);
                tr.appendChild(tdPrice);
                tr.appendChild(tdQty);
                tr.appendChild(tdSub);
                tr.appendChild(tdRemove);
                body.appendChild(tr);
            });

            totalEl.textContent = Cart.formatPeso(total);
        }

        clearBtn.addEventListener('click', function () { Cart.clear(); render(); });

        render();
    </script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
